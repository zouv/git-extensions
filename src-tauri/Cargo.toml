[package]
name = "git-extensions"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "git_extensions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
thiserror = "2"
