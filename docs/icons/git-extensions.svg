<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ge-title ge-desc">
  <title id="ge-title">Git Extensions</title>
  <desc id="ge-desc">Dark navy rounded icon with an ice-blue commit graph, a cyan feature branch and an amber extension node.</desc>
  <!--
    图标定位：Git 分支 + 扩展节点（暗色主题）。
    - 深海军蓝圆角底：适配深色任务栏，仍以浅色提交图保持辨识度；
    - 冰白提交图：一条主干向上分叉为左右两条分支，直接表达 Git 历史与分支；
    - 青色分支：强调 feature branch / 扩展出来的工作线；
    - 橙色圆角菱形：作为分支末端的「扩展节点」，与圆形 commit 区分；
    - 蓝色外缘：深色背景下仍能从任务栏 / 资源管理器中分离；
    - 构图贴边、圆角外透明，512 viewBox，不含字体 / 脚本 / 外部依赖。
  -->
  <defs>
    <linearGradient id="ge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25354d"/>
      <stop offset="0.55" stop-color="#111a29"/>
      <stop offset="1" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="ge-branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#22b8e6"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="ge-extension" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底与双层描边 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ge-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.65"/>
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.1"/>

  <!-- 提交图：主干在下方汇合，向上分叉；右分支末端为扩展节点 -->
  <g>
    <path d="M256 378 V266" fill="none" stroke="#e6f0ff" stroke-width="44" stroke-linecap="round"/>
    <path d="M256 266 C 230 228 202 194 184 158" fill="none" stroke="#e6f0ff" stroke-width="40" stroke-linecap="round"/>
    <path d="M256 266 C 282 228 310 194 328 158" fill="none" stroke="url(#ge-branch)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="256" cy="378" r="38" fill="#e6f0ff"/>
    <circle cx="256" cy="266" r="38" fill="#e6f0ff"/>
    <circle cx="184" cy="146" r="38" fill="#e6f0ff"/>
    <rect x="296" y="114" width="64" height="64" rx="12" transform="rotate(45 328 146)" fill="url(#ge-extension)"/>
    <circle cx="328" cy="146" r="11" fill="#fff7e6"/>
  </g>
</svg>
